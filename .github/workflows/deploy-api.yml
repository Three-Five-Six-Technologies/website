name: Deploy contact form API

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

permissions:
  id-token: write   # sign in to Azure with OIDC, no stored secrets
  contents: read

env:
  # Not secrets: the Azure side only trusts this repo's main branch.
  AZURE_CLIENT_ID: '00000000-0000-0000-0000-000000000000'        # id-github-website-deploy
  AZURE_TENANT_ID: '00000000-0000-0000-0000-000000000000'
  AZURE_SUBSCRIPTION_ID: '00000000-0000-0000-0000-000000000000'
  FUNCTION_APP: func-threefivesix-contact

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install production dependencies
        working-directory: api
        run: npm ci --omit=dev

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP }}
          package: api
          sku: flexconsumption
